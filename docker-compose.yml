# Optional local PostgreSQL to test the pipeline before using Supabase:  docker compose up -d
# then in .env: DATABASE_URL=postgresql://crime_user:local_crime_password@localhost:5433/crime_trends
services:
  postgres:
    image: postgres:16
    container_name: cpd_postgres
    environment: {POSTGRES_DB: crime_trends, POSTGRES_USER: crime_user, POSTGRES_PASSWORD: local_crime_password}
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U crime_user -d crime_trends"], interval: 5s, retries: 10}
volumes: {pgdata: {}}
